# 视频日语字幕 → 简体中文 翻译工具 配置
# 视频路径通过命令行参数传入（例如: python run.py all 0_1_1.mp4），不写在此处。
# 修改保存后重跑会自动跳过已完成步骤。
# 人名区/台词区由 `python run.py regions <视频>` 自动检测后写入，位置固定的视频共用即可
output: output.mp4              # 输出视频文件名（放在 <视频名>_output/ 文件夹内）

ocr:                            # ---- 文字识别 ----
  engine: rapidocr              # 目前可用: rapidocr(本地、免费、支持日文)
  lang: japan                   # 识别语言
  sample_step: 48               # 每多少帧抽 1 帧做 OCR（60fps 时约 800ms 一次）
  min_score: 0.5                # 识别置信度阈值
  min_area: 200                 # 最小文字框面积(像素)
  max_text_chars: 80            # 单条字幕最大字数
  require_japanese: true        # 只保留含日文字符的识别结果
  name_region:                  # 人名区（相对坐标 0~1），regions 自动检测
    left: 0.221
    top: 0.687
    right: 0.412
    bottom: 0.794
  dialogue_region:              # 台词区（相对坐标 0~1）
    left: 0.219
    top: 0.794
    right: 0.68
    bottom: 0.924

translation:                    # ---- 文本翻译 ----
  provider: deepseek            # deepseek | openai | qwen | mock(本地测试用)
  base_url: 'https://api.deepseek.com'                  # OpenAI 兼容接口地址；留空用供应商默认值
  api_key: ''                   # API key，或使用 .env 的 DEEPSEEK_API_KEY
  api_key_env: DEEPSEEK_API_KEY
  model: 'deepseek-v4-flash'                     # 模型名；留空用供应商默认值

render:                         # ---- 渲染输出 ----
  append_height: 160            # 底部加高像素
  append_bg: auto               # 条带底色：auto(匹配台词框暖灰) | black | #RRGGBB
  show_name: true               # 是否显示翻译后的人名
  width: 0                      # 输出宽度，0=保持原分辨率
  fps: 0                        # 输出帧率，0=保持原帧率
  crf: 18                       # x264 质量
  preset: fast                  # x264 编码速度
  font: ''                      # 中文字体路径；留空自动查找系统字体
  font_color: '#FFFFFF'
  stroke: 3                     # 文字描边宽度(像素)
  stroke_color: '#000000'
  frame_margin: 0.03            # 单行宽度留白比例
  font_scale: 0.78              # 全局字号 = 字幕框高度中位数 × 此系数
  test_frames: 0                # 调试用：只渲染前 N 帧，0=全部
